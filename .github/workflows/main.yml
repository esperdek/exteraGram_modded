name: Build dumbukGram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Arm64 Release APK
        run: ./gradlew assembleArm64Release --no-daemon --no-configuration-cache --max-workers=2 --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dumbukGram-arm64
          path: TMessagesProj/build/outputs/apk/arm64/release/*.apk
          
